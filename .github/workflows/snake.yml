name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ffffff&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Inject CSS into SVGs to color the snake head red
      - name: Color snake head red
        run: |
          for file in dist/*.svg; do
            sed -i 's|</svg>|<style>svg path[stroke], svg rect:nth-last-child(1) { fill: #ff0000 !important; } .snake-head, path:first-of-type { stroke: #ff0000 !important; }</style></svg>|' "$file"
          done

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
